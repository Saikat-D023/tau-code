<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tau-Code Dashboard</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-layout">
        <!-- LEFT SIDEBAR -->
        <nav id="sidebar" class="sidebar">
            <div class="logo">
                <div class="logo-icon">τ</div>
                <h1>Tau-Code</h1>
            </div>
            <div class="nav-label">Workspace</div>
            <ul class="nav-tabs">
                <li class="nav-item active" data-tab="overview"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Overview</li>
                <li class="nav-item" data-tab="gateway"><svg viewBox="0 0 24 24"><path d="M4 4h16v12H8l-4 4z"/></svg>Gateway</li>
                <li class="nav-item" data-tab="loop"><svg viewBox="0 0 24 24"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg>Loop</li>
                <li class="nav-item" data-tab="graph"><svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="12" r="2.5"/><circle cx="6" cy="18" r="2.5"/><path d="M8.3 7l7.4 4M8.3 17l7.4-4"/></svg>Graph</li>
                <li class="nav-item" data-tab="memory"><svg viewBox="0 0 24 24"><path d="M12 18V5m3 8a4.17 4.17 0 0 1-3-4a4.17 4.17 0 0 1-3 4m8.598-6.5A3 3 0 1 0 12 5a3 3 0 1 0-5.598 1.5"/><path d="M17.997 5.125a4 4 0 0 1 2.526 5.77"/><path d="M18 18a4 4 0 0 0 2-7.464"/><path d="M19.967 17.483A4 4 0 1 1 12 18a4 4 0 1 1-7.967-.517"/><path d="M6 18a4 4 0 0 1-2-7.464"/><path d="M6.003 5.125a4 4 0 0 0-2.526 5.77"/></svg>Memory</li>
                <li class="nav-item" data-tab="tools"><svg viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5 5L3 18l3 3 6.7-6.7a4 4 0 0 0 5-5l-2.5 2.5-2.4-.6-.6-2.4z"/></svg>Tools</li>
            </ul>
            <div class="nav-label">System</div>
            <ul class="nav-tabs">
                <li class="nav-item" data-tab="database"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>Database</li>
                <li class="nav-item" data-tab="ops"><svg viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>Ops</li>
                <li class="nav-item" data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</li>
            </ul>
            <div class="sidebar-foot">
                <span id="sidebar-meta">tau</span>
                <button class="theme-toggle" id="theme-toggle" type="button">theme</button>
            </div>
        </nav>

        <div class="resize-handle" id="resize-sidebar"></div>

        <!-- CENTER MAIN CONTENT -->
        <main id="center-content" class="center-content">
            <!-- Dynamic Tab Content goes here -->
            <div id="tab-container"></div>
        </main>

        <div class="resize-handle" id="resize-chat"></div>

        <!-- RIGHT CHAT DOCK -->
        <aside id="chat-dock" class="chat-dock">
            <header class="chat-header">
                <h3>Chat Dock</h3>
                <div class="status">
                    <span class="status-dot online"></span>
                    <span class="status-text">Connected</span>
                </div>
            </header>
            
            <div class="messages" id="messages">
                <div class="message system">
                    <div class="message-content">
                        <p>Welcome to the Tau-Code Dashboard.</p>
                    </div>
                </div>
            </div>
            
            <div class="input-area">
                <form id="chat-form">
                    <div class="input-wrapper">
                        <textarea id="message-input" placeholder="Message Tau-Code..." rows="1" required autofocus></textarea>
                        <button type="submit" id="send-btn" class="send-button" disabled>
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="22" y1="2" x2="11" y2="13"></line>
                                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                            </svg>
                        </button>
                    </div>
                </form>
            </div>
        </aside>
    </div>

    <!-- Approval Modal -->
    <div id="approval-modal" class="modal hidden">
        <div class="modal-content">
            <h3 class="modal-title warning">Approval Required</h3>
            <p id="approval-message">Tau-Code wants to execute an action.</p>
            <div class="modal-actions">
                <button id="btn-deny" class="btn btn-secondary">Deny</button>
                <button id="btn-approve" class="btn btn-primary">Approve</button>
                <button id="btn-always-allow" class="btn btn-danger">Always Allow</button>
            </div>
        </div>
    </div>

    <script src="api.js"></script>
    <script src="components/pills.js"></script>
    <script src="components/resizable-panel.js"></script>
    <script src="components/chat-dock.js"></script>
    
    <script src="tabs/overview.js"></script>
    <script src="tabs/gateway.js"></script>
    <script src="tabs/loop.js"></script>
    <script src="tabs/graph.js"></script>
    <script src="tabs/memory.js"></script>
    <script src="tabs/tools.js"></script>
    <script src="tabs/database.js"></script>
    <script src="tabs/ops.js"></script>
    <script src="tabs/settings.js"></script>
    
    <script src="app.js"></script>
</body>
</html>
